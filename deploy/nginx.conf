# /etc/nginx/sites-available/projgaragem  (troque exemplo.com.br pelo seu domínio)
#
# Deixe só a porta 80 aqui e rode: sudo certbot --nginx -d exemplo.com.br -d www.exemplo.com.br
# O certbot adiciona o HTTPS (porta 443) a este mesmo bloco e cria o redirecionamento de 80 para 443.

upstream projgaragem {
    server unix:/run/projgaragem/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name exemplo.com.br www.exemplo.com.br;

    # Fotos aceitas pelo app: até 15 MB por arquivo (FOTO_UPLOAD_MAX_BYTES em settings.py).
    # O padrão do nginx é 1 MB e recusaria o envio com "413 Request Entity Too Large".
    # 20 MB = 15 MB da foto + os demais campos do formulário.
    client_max_body_size 20m;

    # Fotos enviadas pelos donos. O CSS/JS do site (static) é servido pelo próprio app (WhiteNoise).
    location /media/ {
        alias /srv/projgaragem/app/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location / {
        proxy_pass http://projgaragem;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
