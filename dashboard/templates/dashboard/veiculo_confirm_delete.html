{% extends "dashboard/_base_painel.html" %}

{% block title %}Excluir veículo{% endblock %}

{% block painel_content %}
<h1>Excluir veículo</h1>
<p>Tem certeza que deseja excluir <strong>{{ object.titulo }}</strong>? Essa ação não pode ser desfeita.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'dashboard:veiculo_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
